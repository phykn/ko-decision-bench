# Models under test. `trained_on` records, per task, what the model card says about training data:
#   "split"   the card lists this dataset and the model trained on another split of it (the benchmark uses a
#             held-out split, so the items are unseen but the distribution is in-domain)
#   "related" the card lists Korean data for the same task from another source
#   "unknown" the card mentions data that may cover this task but does not name it
# A task left out means the card names nothing related. Cards were read on 2026-10-19 at the pinned revisions.

[models."nari-4b"]
adapter = "nari"
repo = "blackmallangcow/nari-decision-4b"
revision = "029c4628a38859dce5b0db1742e9c97545aabe12"
card_license = "Apache-2.0"
trained_on = { kornli_xnli = "split", klue_nli = "split", klue_ynat = "split", klue_sts = "split", kobest_boolq = "split", kobest_copa = "split", unsmile_hate = "related" }
note = "Card lists kakaobrain/kor_nli, klue/klue and skt/kobest_v1 (configs not named), and Korean hate speech (K-MHaS, nayohan/korean-hate-speech, KoSBi). XNLI is listed as evaluation-only."

[models."coco-2.4-4b"]
adapter = "coco"
repo = "corners-ai/CoCo-Decision-2.4-4B"
revision = "64ce98c8b3a2661362ff6213bc350c26124247ea"
card_license = "Apache-2.0"
trained_on = { kornli_xnli = "unknown", klue_nli = "unknown", kobest_boolq = "unknown", kobest_copa = "unknown" }
note = "Built on CoCo-Decision-4B-Ko, whose card says 'publicly available Korean and English datasets (intent, reading comprehension, NLI, sentiment, reasoning)' without naming them."

